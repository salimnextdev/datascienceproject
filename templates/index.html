<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wine Quality Predictor</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #24211f;
            background: #f7f4ef;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background: radial-gradient(circle at top right, #f1e4d7, transparent 38%), #f7f4ef;
        }

        main { width: min(900px, 100%); margin: 0 auto; }

        .intro { margin-bottom: 28px; }
        .eyebrow {
            margin: 0 0 10px;
            color: #8b4e39;
            font-size: .75rem;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -.045em; }
        .intro p:last-child { max-width: 620px; color: #6f6a65; line-height: 1.65; }

        form {
            padding: clamp(22px, 5vw, 40px);
            border: 1px solid #e8e0d8;
            border-radius: 22px;
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 20px 60px rgba(62, 42, 30, .08);
        }

        .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        label { display: grid; gap: 8px; color: #4b4540; font-size: .9rem; font-weight: 650; }
        input {
            width: 100%;
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #ded6ce;
            border-radius: 10px;
            background: #fff;
            color: #24211f;
            font: inherit;
        }
        input:focus { border-color: #9c5d45; outline: 3px solid #9c5d4526; }
        button {
            min-height: 50px;
            margin-top: 28px;
            padding: 0 22px;
            border: 0;
            border-radius: 10px;
            background: #713e31;
            color: #fff;
            font: inherit;
            font-weight: 750;
            cursor: pointer;
        }
        button:hover { background: #5e3228; }
        .error { margin: 0 0 20px; color: #a32626; font-weight: 650; }
        .train-link { display: inline-block; margin: 18px 0 0 14px; color: #713e31; }

        @media (max-width: 600px) {
            body { padding: 32px 16px; }
            .fields { grid-template-columns: 1fr; gap: 16px; }
            .train-link { display: block; margin: 16px 0 0; }
        }
    </style>
</head>
<body>
    <main>
        <header class="intro">
            <p class="eyebrow">Wine quality / regression</p>
            <h1>Estimate wine quality</h1>
            <p>Enter the wine's laboratory measurements below. The model estimates its quality score.</p>
        </header>

        <form action="{{ url_for('predict') }}" method="post">
            {% if error %}
                <p class="error" role="alert">{{ error }}</p>
            {% endif %}
            <div class="fields">
                {% for column, field_name, label in features %}
                    <label for="{{ field_name }}">
                        {{ label }}
                        <input
                            id="{{ field_name }}"
                            name="{{ field_name }}"
                            type="number"
                            step="any"
                            required
                            value="{{ request.form.get(field_name, '') }}"
                        >
                    </label>
                {% endfor %}
            </div>
            <button type="submit">Predict quality</button>
            <a class="train-link" href="{{ url_for('training') }}">Train or refresh the model</a>
        </form>
    </main>
</body>
</html>
